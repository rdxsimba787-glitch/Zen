name: Build Android APK

# Run it from the Actions tab: "Run workflow", type the file name, press Run.
# When it finishes, download the APK from the run's "Artifacts" section.
on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'APK file name, letters/numbers/-/_ only (e.g. MyApp)'
        required: true
        default: 'MyApp'
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check APK name
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          if [[ ! "$APK_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid APK name: $APK_NAME (use only letters, numbers, - and _)"
            exit 1
          fi
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate app icon and splash screen
        run: |
          if [ -d resources ]; then npx capacitor-assets generate --android; fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          if-no-files-found: error
